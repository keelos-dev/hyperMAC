[package]
name = "efiprobe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
uefi = { version = "0.35", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.11"

[profile.release]
opt-level = "s"
panic = "abort"

[profile.dev]
panic = "abort"
